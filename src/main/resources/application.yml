server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    session:
      cookie:
        http-only: true

spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  api:
    version: "2.0.0"
  upload-dir: uploads